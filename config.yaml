# Cryptography Manager configuration.
#
# This file holds cryptographic parameters: privacy budgets, data bounds and
# backend defaults. Deployment concerns -- where to forward audit records, how
# to verify tokens, where to keep state -- come from environment variables
# instead, so the same file can be mounted into any environment unchanged.
# See the README for the full list of environment variables.

general:
  debug: false

differential_privacy:
  # Noise mechanism and privacy leakage probability.
  default_mechanism: laplace
  default_delta: 1.0e-5

  # Total epsilon granted to each user. When the service runs, this is the
  # per-user budget the store hands out and decrements; a user whose budget
  # reaches zero is refused until it is reset.
  privacy_budget_limit: 1.0

  # Default value bounds, used when a request does not carry its own.
  # Every query except Count needs bounds: they determine sensitivity, and
  # letting the backend infer them leaks privacy that was never accounted for.
  data:
    database_path: "./examples/database.csv"
    numerical_column: "ID"
    lower_bound: 0
    upper_bound: 999

  # A fixed plan of queries, executed together by the library batch path
  # (adapter.execute_all). The REST service ignores this list: there, each
  # request carries its own query type and epsilon cost.
  #
  # The epsilon values below must sum to no more than privacy_budget_limit,
  # which is checked when the adapter is constructed. These total 0.90.
  queries:
    - name: count
      type: Count
      epsilon: 0.05

    - name: max
      type: Max
      epsilon: 0.05

    - name: min
      type: Min
      epsilon: 0.05

    - name: median
      type: Median
      epsilon: 0.10

    - name: mean
      type: BoundedMean
      epsilon: 0.10

    - name: sum
      type: BoundedSum
      epsilon: 0.15

    - name: stddev
      type: BoundedStandardDeviation
      epsilon: 0.20

    - name: variance
      type: BoundedVariance
      epsilon: 0.20
