name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ai-team-uoa/recitals-cryptography-manager

# Cancel superseded runs on the same branch; only the newest matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full range the package claims to support. The container runs
        # 3.10, so that is the version the image is actually built against.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pinned to the uv that produced uv.lock, matching the Dockerfile.
          version: "0.12.7"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dp --extra examples

      - name: Lint
        run: uv run ruff check src/ examples/ tests/

      - name: Type-check
        run: uv run basedpyright src/

      - name: Test
        run: uv run pytest

      - name: Verify the examples still run
        run: |
          uv run python examples/dp.py
          uv run python examples/encryption.py

  image:
    name: Build and publish the container image
    runs-on: ubuntu-latest
    needs: quality
    # Pull requests are built to prove the Dockerfile still works, but never
    # published: a fork must not be able to push to the registry.
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          # Loaded locally rather than pushed, so the smoke test below runs
          # against the exact image that will be published.
          load: true
          tags: crm:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name crm -p 8000:8000 crm:smoke-test
          for i in $(seq 1 60); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' crm)" = "healthy" ]; then
              echo "container healthy after ${i}s"; break
            fi
            sleep 1
          done

          echo "--- health ---"
          curl -fsS http://127.0.0.1:8000/health

          echo "--- an unauthenticated request must be refused ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8000/cryptography \
            -H 'Content-Type: application/json' \
            -d '{"operation":"differential_privacy","backend":"pydp","input_data":{"data":[1]}}')
          [ "$code" = "403" ] || { echo "expected 403, got $code"; exit 1; }

          echo "--- a differential privacy query must succeed ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8000/cryptography \
            -H 'Authorization: Bearer ci-smoke-test' \
            -H 'Content-Type: application/json' \
            -d '{"operation":"differential_privacy","backend":"pydp","input_data":{"data":[1,2,3,4,5]},"parameters":{"query_type":"Count","epsilon_cost":0.1}}')
          [ "$code" = "200" ] || { echo "expected 200, got $code"; exit 1; }

          echo "--- every request must have been audited ---"
          lines=$(docker exec crm sh -c 'wc -l < /app/audit/crm-audit.jsonl')
          [ "$lines" -ge 2 ] || { echo "expected >=2 audit records, got $lines"; exit 1; }

          docker rm -f crm

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          # PyDP publishes x86_64 manylinux wheels only, so an arm64 image
          # cannot be built. Revisit if that changes upstream.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
